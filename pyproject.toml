[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-exam-hall-backend"
version = "1.0.0"
description = "Smart Exam Hall Verification System Backend"
authors = [
    {name = "Smart Exam Hall Team", email = "contact@smartexamhall.com"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "Flask==3.0.3",
    "Flask-CORS==4.0.1",
    "python-dotenv==1.0.1",
    "supabase==2.5.1",
    "face-recognition==1.3.0",
    "dlib==19.24.6",
    "opencv-python==4.9.0.80",
    "Pillow==10.4.0",
    "numpy==1.26.4",
    "requests==2.32.3",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
smart-exam-hall = "app:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
